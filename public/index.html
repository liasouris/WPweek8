<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <title>Index</title>
</head>
<body>
  <nav>
    <div class="nav-wrapper">
      <a href="#" class="brand-logo">Thred it</a>
      <ul class="right">
        <li>
          <form id="loginForm" class="row" style="margin: 0;">
            <div class="input-field col s4">
              <input type="email" id="email" class="navbar-input" required>
              <label for="email">Email</label>
            </div>
            <div class="input-field col s4">
              <input type="password" id="password" class="navbar-input" required>
              <label for="password">Password</label>
            </div>
            <div class="col s4">
              <button type="submit" class="btn waves-effect waves-light">Login</button>
            </div>
          </form>
        </li>
        <li><a href="register.html" class="btn waves-effect waves-light">Register</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div id="topicForm" class="row" style="display: none;">
      <div class="input-field col s12">
        <input type="text" id="topicTitle" required>
        <label for="topicTitle">Topic Title</label>
      </div>
      <div class="input-field col s12">
        <textarea id="topicText" class="materialize-textarea" required></textarea>
        <label for="topicText">Topic Text</label>
      </div>
      <button id="postTopic" class="btn waves-effect waves-light">Post</button>
    </div>

    <div id="topics"></div>
  </div>

  <script src="js/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
